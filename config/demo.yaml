# (R6), so the simulated arms look like the real ones.
sim_q0:
  left:  [5.031, 1.228, -4.317, 1.099, 3.717, 0.908, -1.751]
  right: [-1.967, 1.46, -3.639, 0.44, 4.336, 0.967, -1.805]

# arm/arm_follow_node_v6.py options. Real arms: R5/R6's, which passed (docs/results/r5_*).
